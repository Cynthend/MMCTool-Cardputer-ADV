<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CardLyre Pro — Song to GUIDE (.txt) Converter</title>
<style>
  :root {
    --bg: #0a0602; --panel: #160d04; --border: #9e5a00;
    --amber: #ffc314; --green: #50ff8c; --text: #fff0be; --dim: #9c793e;
  }
  * { box-sizing: border-box; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  body {
    margin: 0; padding: 20px; background: var(--bg); color: var(--text);
    background-image: repeating-linear-gradient(0deg, rgba(255,175,0,0.03) 0px, rgba(255,175,0,0.03) 1px, transparent 1px, transparent 3px);
  }
  .wrap { max-width: 760px; margin: 0 auto; border: 1px solid var(--border); background: var(--panel); padding: 20px; border-radius: 8px; box-shadow: 0 0 28px rgba(255,165,0,0.12); }
  h1 { margin: 0 0 6px; color: var(--amber); font-size: 22px; letter-spacing: 1px; }
  p.sub { margin: 0 0 18px; color: var(--green); font-size: 13px; }
  .drop {
    border: 2px dashed var(--border); border-radius: 6px; padding: 26px; text-align: center;
    cursor: pointer; transition: 0.15s; background: rgba(255,175,0,0.03);
  }
  .drop:hover { border-color: var(--amber); background: rgba(255,175,0,0.08); }
  input[type=file] { display: none; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0; align-items: center; }
  label { font-size: 13px; color: var(--dim); }
  select, input[type=number] {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    padding: 6px 10px; border-radius: 4px; font-size: 13px;
  }
  button {
    background: var(--amber); color: #120800; border: none; padding: 9px 16px;
    border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px;
  }
  button.sec { background: transparent; color: var(--green); border: 1px solid var(--green); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  textarea {
    width: 100%; height: 150px; background: var(--bg); color: var(--green);
    border: 1px solid var(--border); border-radius: 4px; padding: 10px; font-size: 13px; resize: vertical;
  }
  .status { font-size: 12px; color: var(--dim); margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>CARDLYRE PRO — SONG TO GUIDE CONVERTER</h1>
  <p class="sub">Convert any .MID (recommended) or .MP3/.WAV melody into a /CardLyre_Songs/*.txt guide file — 100% in your browser.</p>

  <label class="drop" id="dropZone">
    <input type="file" id="fileInput" accept=".mid,.midi,.mp3,.wav,.m4a,.ogg">
    <div style="font-size:15px;color:var(--amber);font-weight:bold;">Drop .MID / .MP3 / .WAV here or Click to Browse</div>
    <div style="font-size:12px;color:var(--dim);margin-top:6px;">MIDI gives 100% exact notes • MP3/WAV uses browser pitch detection (best on piano/solo melodies)</div>
  </label>

  <div class="row">
    <label>Max Notes: <input type="number" id="maxNotes" value="180" min="16" max="256" style="width:72px"></label>
    <label>Transpose: <input type="number" id="transpose" value="0" min="-24" max="24" style="width:64px"></label>
    <button id="previewBtn" class="sec" disabled>▶ Preview</button>
    <button id="downloadBtn" disabled>⬇ Download .txt for SD</button>
  </div>

  <textarea id="outNotes" placeholder="Notes will appear here (e.g. A4 C5 E5 F#4 ...) — you can also type or edit notes manually!"></textarea>
  <div class="status" id="status">Put the downloaded .txt file into /CardLyre_Songs/ on your Cardputer microSD, then HOLD / (1.3s) to start GUIDE mode!</div>
</div>

<script>
const NOTE_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
let rawMidis = [];
let baseName = "song";

function midiToName(m) {
  m = Math.max(48, Math.min(73, m)); // Fold into CardLyre Piano range C3..C#5
  return NOTE_NAMES[m % 12] + (Math.floor(m / 12) - 1);
}

function foldToPiano(m) {
  while (m < 48) m += 12;
  while (m > 73) m -= 12;
  return m;
}

function refreshOutput() {
  const tr = parseInt(document.getElementById("transpose").value || "0", 10);
  const lim = Math.min(256, Math.max(1, parseInt(document.getElementById("maxNotes").value || "180", 10)));
  const out = rawMidis.slice(0, lim).map(m => midiToName(foldToPiano(m + tr)));
  document.getElementById("outNotes").value = out.join(" ");
  const has = out.length > 0;
  document.getElementById("previewBtn").disabled = !has;
  document.getElementById("downloadBtn").disabled = !has;
}

// --- Lightweight Standard MIDI (SMF Type 0/1) Parser ---
function parseMidi(buf) {
  const d = new DataView(buf);
  let pos = 0;
  function readStr(n) { let s=""; for(let i=0;i<n;i++) s+=String.fromCharCode(d.getUint8(pos++)); return s; }
  function readVLQ() { let v=0, b; do { b=d.getUint8(pos++); v=(v<<7)|(b&0x7F); } while(b&0x80); return v; }

  if (readStr(4) !== "MThd") throw new Error("Not a valid MIDI file");
  pos += 4; // header len
  pos += 2; // format
  const nTracks = d.getUint16(pos); pos += 2;
  pos += 2; // division

  const events = [];
  for (let t = 0; t < nTracks; t++) {
    if (pos + 8 > d.byteLength) break;
    const id = readStr(4);
    const len = d.getUint32(pos); pos += 4;
    const end = pos + len;
    if (id !== "MTrk") { pos = end; continue; }
    let tick = 0, runStatus = 0;
    while (pos < end) {
      tick += readVLQ();
      let st = d.getUint8(pos);
      if (st < 0x80) { st = runStatus; } else { pos++; if (st < 0xF0) runStatus = st; }
      const type = st & 0xF0;
      if (type === 0x90) {
        const note = d.getUint8(pos++), vel = d.getUint8(pos++);
        if (vel > 0 && (st & 0x0F) !== 9) events.push({ tick, note }); // skip drum ch 10
      } else if (type === 0x80 || type === 0xA0 || type === 0xB0 || type === 0xE0) {
        pos += 2;
      } else if (type === 0xC0 || type === 0xD0) {
        pos += 1;
      } else if (st === 0xFF) {
        pos++; const ml = readVLQ(); pos += ml;
      } else if (st === 0xF0 || st === 0xF7) {
        const sl = readVLQ(); pos += sl;
      } else { pos = end; }
    }
    pos = end;
  }
  events.sort((a, b) => a.tick - b.tick || b.note - a.note);
  // Keep top melody note per timestamp window
  const notes = [];
  let lastTick = -9999;
  for (const ev of events) {
    if (ev.tick - lastTick >= 20) {
      notes.push(ev.note);
      lastTick = ev.tick;
    }
  }
  return notes;
}

// --- Browser Autocorrelation Pitch Detection for MP3/WAV ---
async function parseAudio(buf) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const audio = await ctx.decodeAudioData(buf.slice(0));
  const data = audio.getChannelData(0);
  const sr = audio.sampleRate;
  const win = 2048;
  const hop = Math.floor(sr * 0.14); // every 140ms
  const notes = [];
  let lastMidi = -1;

  for (let i = 0; i + win < data.length && notes.length < 256; i += hop) {
    let rms = 0;
    for (let j = 0; j < win; j++) rms += data[i + j] * data[i + j];
    rms = Math.sqrt(rms / win);
    if (rms < 0.02) continue;

    let bestLag = -1, bestCorr = 0;
    const minLag = Math.floor(sr / 1100);
    const maxLag = Math.floor(sr / 110);
    for (let lag = minLag; lag < maxLag; lag++) {
      let c = 0;
      for (let j = 0; j < win - lag; j += 2) c += data[i + j] * data[i + j + lag];
      if (c > bestCorr) { bestCorr = c; bestLag = lag; }
    }
    if (bestLag > 0) {
      const freq = sr / bestLag;
      const midi = Math.round(69 + 12 * Math.log2(freq / 440));
      if (midi >= 36 && midi <= 88 && midi !== lastMidi) {
        notes.push(midi);
        lastMidi = midi;
      }
    }
  }
  ctx.close();
  return notes;
}

async function handleFile(file) {
  const status = document.getElementById("status");
  baseName = file.name.replace(/\.[^.]+$/, "").replace(/[^a-zA-Z0-9_-]/g, "_").slice(0, 16) || "song";
  status.textContent = "Analyzing " + file.name + "...";
  try {
    const buf = await file.arrayBuffer();
    if (/\.midi?$/i.test(file.name)) {
      rawMidis = parseMidi(buf);
      status.textContent = "Parsed " + rawMidis.length + " MIDI notes! Ready to download.";
    } else {
      rawMidis = await parseAudio(buf);
      status.textContent = "Extracted " + rawMidis.length + " melody notes from audio! (Edit below if needed)";
    }
    refreshOutput();
  } catch (e) {
    status.textContent = "Error: " + e.message;
  }
}

document.getElementById("fileInput").addEventListener("change", e => { if (e.target.files[0]) handleFile(e.target.files[0]); });
const dz = document.getElementById("dropZone");
dz.addEventListener("dragover", e => { e.preventDefault(); dz.style.borderColor = "#ffc314"; });
dz.addEventListener("dragleave", () => { dz.style.borderColor = "#9e5a00"; });
dz.addEventListener("drop", e => { e.preventDefault(); dz.style.borderColor = "#9e5a00"; if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
document.getElementById("transpose").addEventListener("input", refreshOutput);
document.getElementById("maxNotes").addEventListener("input", refreshOutput);

document.getElementById("previewBtn").addEventListener("click", () => {
  const toks = document.getElementById("outNotes").value.trim().split(/\s+/).slice(0, 32);
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  toks.forEach((t, idx) => {
    const m = t.match(/^([A-G])(#?)(\d)$/i);
    if (!m) return;
    const semi = NOTE_NAMES.indexOf(m[1].toUpperCase() + m[2]);
    const midi = (parseInt(m[3], 10) + 1) * 12 + semi;
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = "triangle";
    osc.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
    g.gain.setValueAtTime(0.18, ctx.currentTime + idx * 0.22);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.22 + 0.20);
    osc.connect(g).connect(ctx.destination);
    osc.start(ctx.currentTime + idx * 0.22);
    osc.stop(ctx.currentTime + idx * 0.22 + 0.21);
  });
});

document.getElementById("downloadBtn").addEventListener("click", () => {
  const txt = document.getElementById("outNotes").value.trim();
  const blob = new Blob([txt + "\n"], { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = baseName + ".txt";
  a.click();
});
</script>
</body>
</html>
